# Replace the two YOUR_... values after creating the GitHub repo and auth-only Netlify project.
backend:
  name: github
  repo: andalib-sa/samiras-english-hub
  branch: main
  site_domain: YOUR_NETLIFY_AUTH_SITE.netlify.app

media_folder: assets/uploads
public_folder: assets/uploads
publish_mode: simple

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: main
        label: Main Site Settings
        file: content/site.json
        format: json
        fields:
          - { label: Site title, name: site_title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Homepage introduction, name: hero_intro, widget: text }
          - { label: Short about text, name: about_short, widget: text }
          - { label: Full about text, name: about_long, widget: text }
          - { label: Contact URL, name: contact_url, widget: string, required: false }
          - { label: Welcome audio, name: welcome_audio, widget: file, required: false }

  - name: resources
    label: Learning Resources
    label_singular: Resource
    folder: content/resources
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{collection}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Short unique ID, e.g. sbs-learn-english" }
      - { label: Resource name, name: title, widget: string }
      - { label: Website URL, name: url, widget: string }
      - { label: Learner-friendly description, name: description, widget: text }
      - label: Skills
        name: skills
        widget: select
        multiple: true
        options:
          - { label: Listening, value: listen }
          - { label: Speaking, value: speak }
          - { label: Reading, value: read }
          - { label: Writing, value: write }
          - { label: Interactive practice, value: practise }
      - label: Levels
        name: levels
        widget: select
        multiple: true
        options:
          - { label: Beginner, value: beginner }
          - { label: Intermediate, value: intermediate }
          - { label: Advanced, value: advanced }
      - label: Page / collection
        name: collection
        widget: select
        options:
          - { label: English resources, value: english }
          - { label: Academic English, value: academic }
          - { label: Dictionary & vocabulary, value: dictionary }
          - { label: Learning community, value: community }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Australian English / Australia-focused, name: australian, widget: boolean, default: false }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false }
      - label: Icon
        name: icon
        widget: select
        default: book
        options: [book, headphones, audio, news, community, puzzle, computer, graduation, pen, mic]
